name: Prewitt Ridge
description: >-
  Prewitt Ridge builds SysGit, "the collaboration layer for complex hardware" —
  an enterprise platform that applies software development practices to systems
  engineering. SysGit provides Git-based version control for requirements and
  system models, Model-Based Systems Engineering (MBSE) workflows, AI-assisted
  systems engineering automation, and SysMLv2 compliance for open-standards
  adherence. The platform targets defense and aerospace teams, with customers
  including the US Air Force, GTRI, Leidos, and Anduril. Prewitt Ridge is a
  Techstars-backed company added to the API Evangelist network. As of this
  enrichment pass the company publishes no public API, SDK, developer
  documentation, or .well-known documents.
